# Optional add-on: stable in-cluster endpoint for searxng-deployment.yml.
# See that file for enablement instructions.
apiVersion: v1
kind: Service
metadata:
  name: searxng-service
  namespace: semoss
spec:
  ports:
    - port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    app.kubernetes.io/instance: searxng
    app.kubernetes.io/name: searxng
  type: ClusterIP
