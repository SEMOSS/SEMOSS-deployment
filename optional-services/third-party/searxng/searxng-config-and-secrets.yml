# Optional add-on: settings and secret key for searxng-deployment.yml.
# See that file for enablement instructions.
#
# The ConfigMap carries SearXNG's own settings file. The Deployment mounts it as
# /etc/searxng/settings.yml, where SearXNG looks for it. Anything not set here
# keeps SearXNG's defaults (engines, timeouts, UI).
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
  namespace: semoss
data:
  settings.yml: |
    use_default_settings: true

    server:
      # Private instance that only SEMOSS calls: the limiter would answer the
      # MCP's API calls with HTTP 429 (and it needs a valkey database).
      limiter: false
      public_instance: false

    search:
      # The MCP requests /search?format=json, which returns 403 unless json is listed.
      formats:
        - html
        - json
---
# SearXNG's own secret key (its server.secret_key setting). Replace the
# placeholder with a random value (openssl rand -hex 32) before applying, or keep
# the real value in a git-ignored *.local.yml copy of this file.
apiVersion: v1
kind: Secret
metadata:
  name: searxng-secrets
  namespace: semoss
type: Opaque
stringData:
  SEARXNG_SECRET: "<SEARXNG_SECRET>"
