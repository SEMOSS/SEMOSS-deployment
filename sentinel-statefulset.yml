apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-sentinel
  namespace: semoss
  labels:
    app: redis-sentinel
spec:
  serviceName: redis-sentinel   # headless service for stable per-pod DNS
  replicas: 3                    # quorum of 2 tolerates one sentinel failure
  selector:
    matchLabels:
      app: redis-sentinel
  template:
    metadata:
      labels:
        app: redis-sentinel
    spec:
      containers:
        - name: sentinel
          image: redis:7
          imagePullPolicy: Always
          command: ["sh", "/config/start-sentinel.sh"]
          ports:
            - name: sentinel
              containerPort: 26379
          readinessProbe:
            exec:
              command: ["redis-cli", "-p", "26379", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: sentinel-config
