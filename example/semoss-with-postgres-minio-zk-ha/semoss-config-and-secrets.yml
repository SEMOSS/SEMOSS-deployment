apiVersion: v1
kind: ConfigMap
metadata:
  name: semoss-config
  namespace: semoss
data:
  # ---- Backing databases (Postgres in-cluster; host = postgres service) ----
  CUSTOM_SECURITY_DRIVER: "org.postgresql.Driver"
  CUSTOM_SECURITY_RDBMS_TYPE: "POSTGRES"
  CUSTOM_SECURITY_SCHEMA: "public"
  CUSTOM_SECURITY_DATABASE: "security"

  CUSTOM_LM_DRIVER: "org.postgresql.Driver"
  CUSTOM_LM_RDBMS_TYPE: "POSTGRES"
  CUSTOM_LM_SCHEMA: "public"
  CUSTOM_LM_DATABASE: "localmaster"

  CUSTOM_SCHEDULER_DRIVER: "org.postgresql.Driver"
  CUSTOM_SCHEDULER_RDBMS_TYPE: "POSTGRES"
  CUSTOM_SCHEDULER_SCHEMA: "public"
  CUSTOM_SCHEDULER_DATABASE: "scheduler"

  CUSTOM_THEMES_DRIVER: "org.postgresql.Driver"
  CUSTOM_THEMES_RDBMS_TYPE: "POSTGRES"
  CUSTOM_THEMES_SCHEMA: "public"
  CUSTOM_THEMES_DATABASE: "themes"

  CUSTOM_USER_TRACKING_DRIVER: "org.postgresql.Driver"
  CUSTOM_USER_TRACKING_RDBMS_TYPE: "POSTGRES"
  CUSTOM_USER_TRACKING_SCHEMA: "public"
  CUSTOM_USER_TRACKING_DATABASE: "user_tracking"
  USER_TRACKING_ENABLED: "true"

  CUSTOM_MODEL_INFERENCE_LOGS_DRIVER: "org.postgresql.Driver"
  CUSTOM_MODEL_INFERENCE_LOGS_RDBMS_TYPE: "POSTGRES"
  CUSTOM_MODEL_INFERENCE_LOGS_SCHEMA: "public"
  CUSTOM_MODEL_INFERENCE_LOGS_DATABASE: "model_logs"
  MODEL_INFERENCE_LOGS_ENABLED: "true"

  CUSTOM_PROMPT_DRIVER: "org.postgresql.Driver"
  CUSTOM_PROMPT_RDBMS_TYPE: "POSTGRES"
  CUSTOM_PROMPT_SCHEMA: "public"
  CUSTOM_PROMPT_DATABASE: "prompt_hub"
  PROMPT_DB_ENABLED: "true"

  CUSTOM_AUDITLOGS_DRIVER: "org.postgresql.Driver"
  CUSTOM_AUDITLOGS_RDBMS_TYPE: "POSTGRES"
  CUSTOM_AUDITLOGS_SCHEMA: "public"
  CUSTOM_AUDITLOGS_DATABASE: "audit_logs"
  AUDIT_LOGS_DATABASE_ENABLED: "true"

  # ---- Authentication (native login only for this example) ----
  SECURITY_ON: "true"
  SETSOCIAL: "true"
  REDIRECT: "http://localhost:8080/#/"
  FE_ROUTE: "/Monolith"
  ENABLE_NATIVE: "true"
  ENABLE_NATIVE_REGISTRATION: "true"
  ENABLE_NATIVE_ACCESS_KEY_ALLOWED: "true"
  ENABLE_API_USER: "true"
  API_USER_DYNAMIC: "false"
  ENABLE_MS: "false"
  MONOLITH_COOKIE: "semoss"
  SESSION_TIMEOUT: "28800"
  OPTIONAL_COOKIES: "false"
  MONOLITH_COOKIE_SET_SECURE: "true"   # session cookie Secure flag — "true" requires HTTPS; set "false" for plain HTTP (local/dev) or the cookie won't be sent and login will fail

  # ---- R / Python execution ----
  R_ON: "false"
  NATIVE_PY_SERVER: "true"
  NETTY_PYTHON: "true"
  NETTY_R: "false"
  USE_TCP_PY: "false"
  USE_PY_FILE: "false"
  USE_FILE_PY: "false"
  SMSS_PYTHONHOME: "/usr/lib/python/semossvenv"
  TCP_WORKER: "prerna.tcp.SocketServer"
  TCP_CLIENT: "prerna.tcp.client.NativePySocketClient"

  # ---- File limits (MB) ----
  FILE_TRANSFER_LIMIT: "500"
  FILE_UPLOAD_LIMIT: "500"

  # ---- Clustering: ZooKeeper 3-node ensemble ----
  # ZK_SERVER lists all three members (headless per-pod DNS) so the client can
  # fail over between them. "zookeeper-service:2181" (the ClusterIP) also works.
  DISABLE_GIT_TERMINAL: "true"
  SEMOSS_IS_CLUSTER: "true"
  SCHEDULER_ENDPOINT: "http://localhost:8080/Monolith"
  ZK_SERVER: "zookeeper-0.zookeeper-headless:2181,zookeeper-1.zookeeper-headless:2181,zookeeper-2.zookeeper-headless:2181"
  SEMOSS_IS_CLUSTER_ZK: "true"

  # ---- Object storage: in-cluster MinIO (S3-compatible) ----
  SEMOSS_STORAGE_PROVIDER: "MINIO"
  S3_REGION: "us-east-1"
  S3_BUCKET: "semoss"
  S3_ENDPOINT: "http://minio:9000"
  RCLONE_S3_NO_CHECK_BUCKET: "true"

  # ---- Runtime / sandboxing ----
  T_ON: "false"
  CHROOT_ENABLE: "true"
  CHROOT_DIR: "/opt/chroot"
  CHROOT_SYMLINK_PATHS: "/usr/lib/python"
  FAKECHROOT_EXCLUDE_PATH: "/dev"
  ERROR_REPORT_VALVE_ENABLED: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: semoss-secrets
  namespace: semoss
type: Opaque
stringData:
  # ---- Database credentials (Postgres: myuser / mypassword) ----
  CUSTOM_SECURITY_USERNAME: "myuser"
  CUSTOM_SECURITY_PASSWORD: "mypassword"
  CUSTOM_SECURITY_CONNECTION_URL: "jdbc:postgresql://postgres:5432/security?currentSchema=public"

  CUSTOM_LM_USERNAME: "myuser"
  CUSTOM_LM_PASSWORD: "mypassword"
  CUSTOM_LM_CONNECTION_URL: "jdbc:postgresql://postgres:5432/localmaster?currentSchema=public"

  CUSTOM_SCHEDULER_USERNAME: "myuser"
  CUSTOM_SCHEDULER_PASSWORD: "mypassword"
  CUSTOM_SCHEDULER_CONNECTION_URL: "jdbc:postgresql://postgres:5432/scheduler?currentSchema=public"

  CUSTOM_THEMES_USERNAME: "myuser"
  CUSTOM_THEMES_PASSWORD: "mypassword"
  CUSTOM_THEMES_CONNECTION_URL: "jdbc:postgresql://postgres:5432/themes?currentSchema=public"

  CUSTOM_USER_TRACKING_USERNAME: "myuser"
  CUSTOM_USER_TRACKING_PASSWORD: "mypassword"
  CUSTOM_USER_TRACKING_CONNECTION_URL: "jdbc:postgresql://postgres:5432/user_tracking?currentSchema=public"

  CUSTOM_MODEL_INFERENCE_LOGS_USERNAME: "myuser"
  CUSTOM_MODEL_INFERENCE_LOGS_PASSWORD: "mypassword"
  CUSTOM_MODEL_INFERENCE_LOGS_CONNECTION_URL: "jdbc:postgresql://postgres:5432/model_logs?currentSchema=public"

  CUSTOM_PROMPT_USERNAME: "myuser"
  CUSTOM_PROMPT_PASSWORD: "mypassword"
  CUSTOM_PROMPT_CONNECTION_URL: "jdbc:postgresql://postgres:5432/prompt_hub?currentSchema=public"

  CUSTOM_AUDITLOGS_USERNAME: "myuser"
  CUSTOM_AUDITLOGS_PASSWORD: "mypassword"
  CUSTOM_AUDITLOGS_CONNECTION_URL: "jdbc:postgresql://postgres:5432/audit_logs?currentSchema=public"

  # ---- MinIO credentials (S3-compatible) ----
  S3_ACCESS_KEY: "minioadmin"
  S3_SECRET_KEY: "minioadmin"
