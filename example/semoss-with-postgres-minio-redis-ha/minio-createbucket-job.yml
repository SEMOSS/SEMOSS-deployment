apiVersion: batch/v1
kind: Job
metadata:
  name: minio-createbucket
  namespace: semoss
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: minio-createbucket
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              until mc alias set local http://minio:9000 minioadmin minioadmin; do
                echo "waiting for minio..."; sleep 3;
              done
              mc mb -p local/semoss || true
              echo "bucket 'semoss' ready"
