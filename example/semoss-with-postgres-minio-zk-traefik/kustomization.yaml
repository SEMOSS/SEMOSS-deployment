apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Self-contained example: SEMOSS + Postgres + Zookeeper exposed using Traefik.
# Deploy with:  kubectl apply -k .
# The SEMOSS pod uses initContainers to wait for its dependencies, so a single
# apply works regardless of creation order.

namespace: semoss

resources:
  - namespace.yml
  # Backing services
  - postgres-init-configmap.yml
  - postgres-deployment.yml
  - postgres-service.yml
  - minio-statefulset.yml
  - minio-service.yml
  - minio-createbucket-job.yml
  # ZooKeeper alternative (3-node ensemble):
  - zookeeper-headless-service.yml
  - zookeeper-statefulset.yml
  - zookeeper-service.yml
  # SEMOSS
  - semoss-config-and-secrets.yml
  - semoss-nginx-config.yml
  - semoss-deployment.yml
  - semoss-service.yml
