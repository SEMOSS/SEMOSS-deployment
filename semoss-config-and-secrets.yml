apiVersion: v1
kind: ConfigMap
metadata:
  name: semoss-config
  namespace: semoss
data:
  # ==========================================================================
  # Backing databases (non-sensitive connection metadata)
  # Credentials + connection URLs live in the semoss-secrets Secret below.
  # ==========================================================================

  # --- Security database ---
  CUSTOM_SECURITY_DRIVER: "org.postgresql.Driver"
  CUSTOM_SECURITY_RDBMS_TYPE: "POSTGRES"
  CUSTOM_SECURITY_SCHEMA: "public"
  CUSTOM_SECURITY_DATABASE: "security"

  # --- Local master database ---
  CUSTOM_LM_DRIVER: "org.postgresql.Driver"
  CUSTOM_LM_RDBMS_TYPE: "POSTGRES"
  CUSTOM_LM_SCHEMA: "public"
  CUSTOM_LM_DATABASE: "localmaster"

  # --- Scheduler database ---
  CUSTOM_SCHEDULER_DRIVER: "org.postgresql.Driver"
  CUSTOM_SCHEDULER_RDBMS_TYPE: "POSTGRES"
  CUSTOM_SCHEDULER_SCHEMA: "public"
  CUSTOM_SCHEDULER_DATABASE: "scheduler"

  # --- Themes database ---
  CUSTOM_THEMES_DRIVER: "org.postgresql.Driver"
  CUSTOM_THEMES_RDBMS_TYPE: "POSTGRES"
  CUSTOM_THEMES_SCHEMA: "public"
  CUSTOM_THEMES_DATABASE: "themes"

  # --- User tracking database ---
  CUSTOM_USER_TRACKING_DRIVER: "org.postgresql.Driver"
  CUSTOM_USER_TRACKING_RDBMS_TYPE: "POSTGRES"
  CUSTOM_USER_TRACKING_SCHEMA: "public"
  CUSTOM_USER_TRACKING_DATABASE: "user_tracking"
  USER_TRACKING_ENABLED: "true"

  # --- Model inference logs database ---
  CUSTOM_MODEL_INFERENCE_LOGS_DRIVER: "org.postgresql.Driver"
  CUSTOM_MODEL_INFERENCE_LOGS_RDBMS_TYPE: "POSTGRES"
  CUSTOM_MODEL_INFERENCE_LOGS_SCHEMA: "public"
  CUSTOM_MODEL_INFERENCE_LOGS_DATABASE: "model_logs"
  MODEL_INFERENCE_LOGS_ENABLED: "true"

  # --- Prompt hub database ---
  CUSTOM_PROMPT_DRIVER: "org.postgresql.Driver"
  CUSTOM_PROMPT_RDBMS_TYPE: "POSTGRES"
  CUSTOM_PROMPT_SCHEMA: "public"
  CUSTOM_PROMPT_DATABASE: "prompt_hub"
  PROMPT_DB_ENABLED: "true"

  # --- Audit logs database ---
  CUSTOM_AUDITLOGS_DRIVER: "org.postgresql.Driver"
  CUSTOM_AUDITLOGS_RDBMS_TYPE: "POSTGRES"
  CUSTOM_AUDITLOGS_SCHEMA: "public"
  CUSTOM_AUDITLOGS_DATABASE: "audit_logs"
  AUDIT_LOGS_DATABASE_ENABLED: "true"

  # --- Collaboration (Brain/Work) database  [DISABLED] ---
  # To enable: create the database, set the flag to "true", uncomment the keys
  # below and the CUSTOM_COLLABORATION_* credentials in semoss-secrets.
  COLLABORATION_DATABASE_ENABLED: "false"
  # CUSTOM_COLLABORATION_DRIVER: "org.postgresql.Driver"
  # CUSTOM_COLLABORATION_RDBMS_TYPE: "POSTGRES"
  # CUSTOM_COLLABORATION_SCHEMA: "public"
  # CUSTOM_COLLABORATION_DATABASE: "collaboration"
  #
  # Brain/Work settings (default in brackets):
  # COLLAB_LLM_ENGINE_ID: ""               # text model engine id users can view; blank turns Brain's text features off
  # COLLAB_CLASSIFIER_ENGINE_ID: ""        # classifier engine id
  # COLLAB_CLASSIFIER_CUTOFFS: ""          # optional per-engine cutoffs, JSON
  # COLLAB_CLASSIFIER_WINDOW: ""           # classifier context window per engine, JSON {"<engine id>": <tokens>} [built-in]
  # COLLAB_CLASSIFY_PARALLEL: ""           # thread classifications run at once [8, max 32]
  # COLLAB_WORK_ITEMS_PARALLEL: ""         # work items run at once [3, max 16]
  # COLLAB_WORK_EXTRACT_PARALLEL: ""       # work extractions run at once [5, max 16]
  # COLLAB_ROUTINE_TIMEOUT_MINUTES: ""     # minutes a routine's agent step may run [10]
  # COLLAB_MEMORY_PROMPT_CHARS: ""         # characters of recalled memory added to a prompt [4000]
  # COLLAB_ATTACHMENT_MAX_MB: ""           # size limit for one email attachment, MB [10]
  # COLLAB_DELEGATION_MAX_FILES: ""        # files sent with a delegation [10]
  # COLLAB_DELEGATION_MAX_FILE_MB: ""      # MB per delegated file [25]
  # COLLAB_DELEGATION_MAX_TOTAL_MB: ""     # MB in total per delegation [100]

  # ==========================================================================
  # Authentication & security
  #
  # Login providers: only NATIVE and MICROSOFT are enabled. Every other
  # provider's *_login flag is set to "false". Secret values (OAuth secret
  # keys, bind/admin passwords, SMTP creds) live in the semoss-secrets Secret
  # below, NOT here. Disabled providers keep their full key set as commented
  # scaffolding so they can be turned on without re-deriving the key names.
  # ==========================================================================

  # --- Core security toggles ---
  SECURITY_ON: "true"
  SETSOCIAL: "true"
  REDIRECT: "<FRONTEND_REDIRECT_URL>"           # REQUIRED: the address the client's browser uses to reach SEMOSS — external host/IP + port or ingress URL (e.g. https://<INGRESS_DNS>/), not the in-cluster service port; post-login redirects here
  FE_ROUTE: "/Monolith"                         # SemossWeb route; unset defaults to "Monolith"

  # --- Native (username/password) login  [ENABLED] ---
  ENABLE_NATIVE: "true"
  ENABLE_NATIVE_REGISTRATION: "true"
  ENABLE_NATIVE_ACCESS_KEY_ALLOWED: "true"
  NATIVE_DISPLAY_NAME: "Native Login"

  # --- API user access ---
  ENABLE_API_USER: "true"
  API_USER_DISPLAY_NAME: "API User"

  # --- Microsoft / Azure AD (OAuth) login  [ENABLED] ---
  ENABLE_MS: "true"
  MS_ACCESS_KEY_ALLOWED: "true"
  MS_CLIENT_ID: "<MS_CLIENT_ID>"
  MS_REDIRECT: "<MS_REDIRECT_URL>"
  MS_AUTHORITY: "https://login.microsoftonline.com/<MS_TENANT_ID>/"
  MS_TENANT: "<MS_TENANT_DOMAIN>"
  MS_LOGIN_EXTERNAL: "false"
  MS_DISPLAY_NAME: "Microsoft Login"
  # MS_SECRET_KEY -> semoss-secrets
  # optional shared OAuth keys (uncomment as needed):
  # MS_SCOPE: "openid profile email"
  # MS_AUTH_URL: ""
  # MS_TOKEN_URL: ""
  # MS_USERINFO_URL: ""
  # MS_JSON: ""
  # MS_AUTO_ADD: "false"
  # MS_GROUPS: ""
  # --- MS Graph API group lookup ---
  MS_GRAPHAPI_LOOKUP: "false"
  # MS_GRAPHAPI_APPLICATION_CREDENTIALS: ""
  # MS_GRAPHAPI_CLIENT_ID: "<MS_CLIENT_ID>"
  # MS_GRAPHAPI_SCOPE: ""
  # MS_GRAPHAPI_GROUP_ID: ""
  # MS_GRAPHAPI_JSON_PATTERN: ""
  # MS_GRAPHAPI_SECRET_KEY -> semoss-secrets

  # --- Public callback origins (Microsoft Graph / GitHub) ---
  # The public origin (scheme://host[:port]) Microsoft and GitHub call back to,
  # for when the URL SEMOSS is served at is not one they can reach. The app
  # URL's path is kept.
  # MS_PUBLIC_ORIGIN_OVERRIDE: "https://<PUBLIC_HOST>"
  # GH_PUBLIC_ORIGIN_OVERRIDE: "https://<PUBLIC_HOST>"
  # GH_WEBHOOK_URL_OVERRIDE: "<FULL_URL_GITHUB_POSTS_WEBHOOK_EVENTS_TO>"

  # --- Other OAuth / SSO providers  [DISABLED] ---
  # Only the login toggle is set live (false). To enable a provider, flip its
  # flag to "true" and uncomment/fill its key block. Each block's secret_key
  # belongs in semoss-secrets, not here.
  ENABLE_ADFS: "false"
  ENABLE_DROPBOX: "false"
  ENABLE_FORGEROCK: "false"
  ENABLE_GENERIC: "false"
  ENABLE_GITHUB: "false"
  ENABLE_GITLAB: "false"
  ENABLE_GOOGLE: "false"
  ENABLE_JIRA: "false"
  ENABLE_KEYCLOAK: "false"
  ENABLE_LINKEDIN: "false"
  ENABLE_OKTA: "false"
  ENABLE_SALESFORCE: "false"
  ENABLE_SERVICENOW: "false"
  ENABLE_SITEMINDER: "false"
  ENABLE_SURVEYMONKEY: "false"
  ENABLE_TWITTER: "false"
  #
  # Shared OAuth key set (replace GOOGLE with any provider above: ADFS, DROPBOX,
  # FORGEROCK, GENERIC, GITHUB, GITLAB, JIRA, KEYCLOAK, LINKEDIN, OKTA,
  # SALESFORCE, SERVICENOW, SITEMINDER, SURVEYMONKEY, TWITTER):
  #   GOOGLE_CLIENT_ID: ""
  #   GOOGLE_REDIRECT: "<REDIRECT_URL>"
  #   GOOGLE_AUTH_URL: ""
  #   GOOGLE_TOKEN_URL: ""
  #   GOOGLE_USERINFO_URL: ""
  #   GOOGLE_SCOPE: ""
  #   GOOGLE_JSON: ""
  #   GOOGLE_BEAN: ""
  #   GOOGLE_AUTO_ADD: "false"
  #   GOOGLE_ACCESS_KEY_ALLOWED: "false"
  #   GOOGLE_DISPLAY_NAME: "Google"
  #   GOOGLE_GROUPS: ""
  #   GOOGLE_GROUP_URL: ""
  #   GOOGLE_GROUP_JSON_PATTERN: ""
  #   GOOGLE_GROUP_STRING_RETURN: ""
  #   GOOGLE_GROUP_STRING_REGEX: ""
  #   GOOGLE_SANITIZE_USER_RESPONSE: "false"
  #   GOOGLE_SANITIZE_GROUP_RESPONSE: "false"
  #   GOOGLE_SECRET_KEY -> semoss-secrets
  # Provider-specific extras:
  #   DROPBOX_ROLE: ""
  #   SERVICENOW_INSTANCE_URL: ""
  #   SITEMINDER_TENANT: ""

  # --- CAC, SAML and Windows user login  [DISABLED] ---
  ENABLE_CAC: "false"
  ENABLE_SAML: "false"
  ENABLE_WINDOWS_USER: "false"
  # CAC_DISPLAY_NAME: ""
  # SAML_DISPLAY_NAME: ""
  # WINDOWS_USER_DISPLAY_NAME: ""
  # SAML attribute mappings: each lists the assertion attribute names that
  # build the field, joined with +
  # SAML_ID: ""
  # SAML_NAME: ""
  # SAML_EMAIL: ""
  # SAML_USERNAME: ""
  # SAML_GROUPS: ""
  # SAML_PROVIDER: ""

  # --- LinOTP login  [DISABLED] ---
  ENABLE_LINOTP: "false"
  # LINOTP_HOSTNAME: ""
  # LINOTP_REALM: ""
  # LINOTP_AUTO_ADD: "false"
  # LINOTP_CHECK_AD: "false"
  # LINOTP_ACCESS_KEY_ALLOWED: "false"
  # LINOTP_DISPLAY_NAME: "LinOTP"
  # LINOTP_ADMIN_USER / LINOTP_ADMIN_PASSWORD -> semoss-secrets

  # --- LDAP login  [DISABLED] ---
  ENABLE_LDAP: "false"
  # LDAP_TYPE: ""
  # LDAP_PRINCIPAL_TEMPLATE: ""
  # LDAP_PROVIDER_URL: ""
  # LDAP_KEY_ID: ""
  # LDAP_KEY_NAME: ""
  # LDAP_KEY_EMAIL: ""
  # LDAP_KEY_USERNAME: ""
  # LDAP_KEY_LAST_PWD_CHANGE: ""
  # LDAP_REQUIRE_PWD_CHANGE_DAYS: ""
  # LDAP_USE_CUSTOM_CONTEXT_FOR_PWD_CHANGE: "false"
  # LDAP_USE_CUSTOM_CONTEXT_FOR_PWD_USERNAME: ""
  # LDAP_SEARCH_CONTEXT_NAME: ""
  # LDAP_SEARCH_CONTEXT_SCOPE: ""
  # LDAP_SEARCH_MATCHING_ATTRIBUTES: ""
  # LDAP_AUTO_ADD: "false"
  # LDAP_ACCESS_KEY_ALLOWED: "false"
  # LDAP_DISPLAY_NAME: "LDAP"
  # LDAP_MASTER_PRINCIPAL / LDAP_MASTER_CREDENTIALS -> semoss-secrets
  # LDAP_USE_CUSTOM_CONTEXT_FOR_PWD_PASSWORD    -> semoss-secrets

  # --- SMTP (email) [DISABLED] ---
  SMTP_ENABLED: "false"
  # SMTP_MAIL_HOST: ""
  # SMTP_MAIL_PORT: ""
  # SMTP_MAIL_SOCKETFACTORY_PORT: ""
  # SMTP_MAIL_SOCKETFACTORY_CLASS: ""
  # SMTP_MAIL_AUTH: "false"
  # SMTP_MAIL_STARTTLS_ENABLE: "false"
  # SMTP_SENDER: ""
  # SMTP_USERNAME / SMTP_PASSWORD -> semoss-secrets

  # --- Session / cookies ---
  MONOLITH_COOKIE: "semoss"
  SESSION_TIMEOUT: "28800"
  OPTIONAL_COOKIES: "false"
  MONOLITH_COOKIE_SET_SECURE: "true"   # session cookie Secure flag — "true" requires HTTPS; set "false" for plain HTTP (local/dev) or the cookie won't be sent and login will fail

  # ==========================================================================
  # R / Python execution engines
  # Python is on by default; set PY_ON: "false" to turn it off.
  # ==========================================================================
  R_ON: "false"
  R_CONNECTION_TYPE: "JRI"
  R_HOME: "/tmp"
  NETTY_R: "false"

  PY_ON: "true"
  SMSS_PYTHONHOME: "/usr/lib/python/semossvenv"
  # "true" sends each Python process's stdout/stderr to the SEMOSS log instead
  # of its console file (default "false"):
  # PY_LOG_CAPTURE_ENABLED: "true"

  # ==========================================================================
  # Node.js  (agent tools + client build service)
  # NODE_HOME does NOT need to be set here: the SEMOSS image ships Node
  # (ARG NODE_VERSION=24.21.0) and sets ENV NODE_HOME=/opt/node. Only add
  # NODE_HOME if you run a custom image with Node installed elsewhere (local,
  # non-Docker installs must set it themselves).
  # ==========================================================================
  AGENT_DEFAULT_TOOLS_ENABLE_NODE: "true"
  #
  # Build service for app clients — deploy optional-services/semoss-maintained/node-builder/
  # first, then uncomment. Use http://localhost:3000 only if the builder runs
  # in the SEMOSS pod (sidecar).
  # NODE_SERVER_ENDPOINT: "http://node-builder-service.semoss.svc.cluster.local:3000"
  #
  # unoserver (LibreOffice document conversion) — deploy
  # optional-services/semoss-maintained/unoserver/ first, then uncomment.
  # UNOSERVER: "http://unoserver-service.semoss.svc.cluster.local:8080"
  #
  # SearXNG (web search for models without a built-in search tool) — deploy
  # optional-services/third-party/searxng/ first, then uncomment both.
  # WEB_SEARCH_ENABLED: "true"
  # SEARXNG_URL: "http://searxng-service.semoss.svc.cluster.local:8080"

  # ==========================================================================
  # File transfer / upload limits (MB)
  # ==========================================================================
  FILE_TRANSFER_LIMIT: "500"
  FILE_UPLOAD_LIMIT: "500"

  # ==========================================================================
  # Clustering  (multi-node coordination / ClusterSynchronizer)
  # Choose ONE synchronization backend below: ZooKeeper or Redis. Enable only
  # one at a time.
  # ==========================================================================
  DISABLE_GIT_TERMINAL: "true"
  SEMOSS_IS_CLUSTER: "true"
  SCHEDULER_ENDPOINT: "http://localhost:8080/Monolith"

  # --- Option A: Redis coordination  [ACTIVE] ---
  # SEMOSS supports three Redis topologies. Enable exactly one by setting the
  # matching *_ENABLED flag; the shared keys (REDIS_ENABLED, REDIS_PASSWORD,
  # REDIS_TIMEOUT_MS, pool sizes) apply to all three.
  # REDIS_PASSWORD / REDIS_SENTINEL_PASSWORD -> semoss-secrets.
  SEMOSS_IS_CLUSTER_REDIS: "true"
  REDIS_ENABLED: "true"
  REDIS_TIMEOUT_MS: "2000"
  REDIS_POOL_MAX_TOTAL: "64"
  REDIS_POOL_MAX_IDLE: "16"
  REDIS_POOL_MIN_IDLE: "1"
  #
  # A1) Sentinel (HA with automatic failover) [ACTIVE] — connects to the
  #     Sentinels and tracks the current master (redis-statefulset.yml +
  #     sentinel-statefulset.yml):
  REDIS_SENTINEL_ENABLED: "true"
  REDIS_MASTER_NAME: "semossmaster"
  REDIS_SENTINEL_NODES: "redis-sentinel-0.redis-sentinel:26379,redis-sentinel-1.redis-sentinel:26379,redis-sentinel-2.redis-sentinel:26379"
  #
  # A2) Standalone (single node) — set REDIS_SENTINEL_ENABLED=false and use:
  # REDIS_HOST: "<REDIS_HOST>"
  # REDIS_PORT: "6379"
  #
  # A3) Redis Cluster (sharded) — set REDIS_SENTINEL_ENABLED=false and use:
  # REDIS_CLUSTER_ENABLED: "true"
  # REDIS_CLUSTER_NODES: "<host1>:6379,<host2>:6379,<host3>:6379"
  # REDIS_CLUSTER_MAX_ATTEMPTS: "5"

  # --- Option B: ZooKeeper coordination  [inactive] ---
  # To switch: set SEMOSS_IS_CLUSTER_REDIS=false (and remove the Redis keys
  # above), then uncomment the two keys below and deploy the ZooKeeper manifests
  # instead of the Redis/Sentinel ones. ZK_SERVER lists all ensemble members;
  # for a single-node ZooKeeper it would be just "zookeeper-service:2181".
  # SEMOSS_IS_CLUSTER_ZK: "true"
  # ZK_SERVER: "zookeeper-0.zookeeper-headless:2181,zookeeper-1.zookeeper-headless:2181,zookeeper-2.zookeeper-headless:2181"

  # ==========================================================================
  # Object storage  (central cloud storage engine)
  # Select the active provider via SEMOSS_STORAGE_PROVIDER. Accepted values:
  #   AWS / S3, MINIO, AZURE, GCP / GCS / GOOGLE, LOCAL_FILE_SYSTEM
  # Non-sensitive settings live here; access/secret keys live in semoss-secrets.
  # Only the active provider's block needs to be uncommented/filled.
  # ==========================================================================
  SEMOSS_STORAGE_PROVIDER: "S3"

  # --- AWS S3  [ACTIVE]  (SEMOSS_STORAGE_PROVIDER=AWS or S3) ---
  S3_REGION: "us-east-1"
  S3_BUCKET: "<S3_BUCKET_NAME>"
  RCLONE_S3_NO_CHECK_BUCKET: "true"
  # S3_ACCESS_KEY / S3_SECRET_KEY -> semoss-secrets

  # --- MinIO  [inactive]  (SEMOSS_STORAGE_PROVIDER=MINIO) ---
  # Reuses the S3_* keys above; additionally set the endpoint of your MinIO
  # server. (MINIO_REGION / MINIO_BUCKET / MINIO_ENDPOINT are also accepted as
  # fallback aliases if you prefer to keep them distinct from the S3 values.)
  # S3_ENDPOINT: "https://<MINIO_HOST>:9000"
  # S3_ACCESS_KEY / S3_SECRET_KEY -> semoss-secrets

  # --- Azure Blob Storage  [inactive]  (SEMOSS_STORAGE_PROVIDER=AZURE) ---
  # AZ_NAME: "<AZURE_STORAGE_ACCOUNT_NAME>"
  # AZ_GENERATE_DYNAMIC_SAS: "false"
  # AZ_USE_MSI: "false"
  # AZ_KEY / AZ_CONN_STRING -> semoss-secrets

  # --- Google Cloud Storage  [inactive]  (SEMOSS_STORAGE_PROVIDER=GCP, GCS, or GOOGLE) ---
  # GCP_REGION: "us-east1"
  # GCP_BUCKET: "<GCP_BUCKET_NAME>"
  # GCP_SERVICE_ACCOUNT_FILE: "/path/to/gcp-service-account.json"

  # ==========================================================================
  # Runtime / sandboxing
  # ==========================================================================
  CHROOT_ENABLE: "true"
  CHROOT_DIR: "/opt/chroot"
  CHROOT_SYMLINK_PATHS: "/usr/lib/python"
  FAKECHROOT_EXCLUDE_PATH: "/dev"
  ERROR_REPORT_VALVE_ENABLED: "true"
  #
  # Agent sandbox. "true" runs agents inside the sandbox and refuses to start
  # one when the sandbox is unavailable; "false" (default) runs them without it.
  # AGENT_SANDBOX_ENABLE: "true"
  # AGENT_SANDBOX_DEFAULT_READS: ""        # comma-separated absolute paths the agent may read; blank uses the OS defaults
  # AGENT_SANDBOX_BLOCK_READS: ""          # comma-separated absolute paths the agent may not read, added to the built-in block list
  # AGENT_SANDBOX_LOOPBACK_NETWORK: "true" # lets the agent reach localhost, which MCP server callbacks need (default "true")
---
apiVersion: v1
kind: Secret
metadata:
  name: semoss-secrets
  namespace: semoss
type: Opaque
stringData:
  # ==========================================================================
  # Database credentials & connection URLs
  # One set per database defined in the semoss-config ConfigMap above.
  # ==========================================================================

  # --- Security database ---
  CUSTOM_SECURITY_USERNAME: "<DB_USERNAME>"
  CUSTOM_SECURITY_PASSWORD: "<DB_PASSWORD>"
  CUSTOM_SECURITY_CONNECTION_URL: "jdbc:postgresql://<DB_HOST>:5432/security?currentSchema=public"

  # --- Local master database ---
  CUSTOM_LM_USERNAME: "<DB_USERNAME>"
  CUSTOM_LM_PASSWORD: "<DB_PASSWORD>"
  CUSTOM_LM_CONNECTION_URL: "jdbc:postgresql://<DB_HOST>:5432/localmaster?currentSchema=public"

  # --- Scheduler database ---
  CUSTOM_SCHEDULER_USERNAME: "<DB_USERNAME>"
  CUSTOM_SCHEDULER_PASSWORD: "<DB_PASSWORD>"
  CUSTOM_SCHEDULER_CONNECTION_URL: "jdbc:postgresql://<DB_HOST>:5432/scheduler?currentSchema=public"

  # --- Themes database ---
  CUSTOM_THEMES_USERNAME: "<DB_USERNAME>"
  CUSTOM_THEMES_PASSWORD: "<DB_PASSWORD>"
  CUSTOM_THEMES_CONNECTION_URL: "jdbc:postgresql://<DB_HOST>:5432/themes?currentSchema=public"

  # --- User tracking database ---
  CUSTOM_USER_TRACKING_USERNAME: "<DB_USERNAME>"
  CUSTOM_USER_TRACKING_PASSWORD: "<DB_PASSWORD>"
  CUSTOM_USER_TRACKING_CONNECTION_URL: "jdbc:postgresql://<DB_HOST>:5432/user_tracking?currentSchema=public"

  # --- Model inference logs database ---
  CUSTOM_MODEL_INFERENCE_LOGS_USERNAME: "<DB_USERNAME>"
  CUSTOM_MODEL_INFERENCE_LOGS_PASSWORD: "<DB_PASSWORD>"
  CUSTOM_MODEL_INFERENCE_LOGS_CONNECTION_URL: "jdbc:postgresql://<DB_HOST>:5432/model_logs?currentSchema=public"

  # --- Prompt hub database ---
  CUSTOM_PROMPT_USERNAME: "<DB_USERNAME>"
  CUSTOM_PROMPT_PASSWORD: "<DB_PASSWORD>"
  CUSTOM_PROMPT_CONNECTION_URL: "jdbc:postgresql://<DB_HOST>:5432/prompt_hub?currentSchema=public"

  # --- Audit logs database ---
  CUSTOM_AUDITLOGS_USERNAME: "<DB_USERNAME>"
  CUSTOM_AUDITLOGS_PASSWORD: "<DB_PASSWORD>"
  CUSTOM_AUDITLOGS_CONNECTION_URL: "jdbc:postgresql://<DB_HOST>:5432/audit_logs?currentSchema=public"

  # --- Collaboration (Brain/Work) database  [DISABLED] ---
  # Uncomment when COLLABORATION_DATABASE_ENABLED is "true" in the ConfigMap.
  # CUSTOM_COLLABORATION_USERNAME: "<DB_USERNAME>"
  # CUSTOM_COLLABORATION_PASSWORD: "<DB_PASSWORD>"
  # CUSTOM_COLLABORATION_CONNECTION_URL: "jdbc:postgresql://<DB_HOST>:5432/collaboration?currentSchema=public"

  # ==========================================================================
  # Authentication secrets
  # Sensitive counterparts of the auth settings in the semoss-config ConfigMap.
  # ==========================================================================

  # --- Microsoft / Azure AD (OAuth) login  [ENABLED] ---
  MS_SECRET_KEY: "<MS_SECRET_KEY>"
  # MS Graph API group lookup (uncomment if MS_GRAPHAPI_LOOKUP=true):
  # MS_GRAPHAPI_SECRET_KEY: "<MS_GRAPHAPI_SECRET_KEY>"

  # --- Other OAuth / SSO provider secret keys  [DISABLED] ---
  # Uncomment the matching provider when you flip its ENABLE_* flag to true.
  # ADFS_SECRET_KEY: "<ADFS_SECRET_KEY>"
  # DROPBOX_SECRET_KEY: "<DROPBOX_SECRET_KEY>"
  # FORGEROCK_SECRET_KEY: "<FORGEROCK_SECRET_KEY>"
  # GENERIC_SECRET_KEY: "<GENERIC_SECRET_KEY>"
  # GITHUB_SECRET_KEY: "<GITHUB_SECRET_KEY>"
  # GITLAB_SECRET_KEY: "<GITLAB_SECRET_KEY>"
  # GOOGLE_SECRET_KEY: "<GOOGLE_SECRET_KEY>"
  # JIRA_SECRET_KEY: "<JIRA_SECRET_KEY>"
  # KEYCLOAK_SECRET_KEY: "<KEYCLOAK_SECRET_KEY>"
  # LINKEDIN_SECRET_KEY: "<LINKEDIN_SECRET_KEY>"
  # OKTA_SECRET_KEY: "<OKTA_SECRET_KEY>"
  # SALESFORCE_SECRET_KEY: "<SALESFORCE_SECRET_KEY>"
  # SERVICENOW_SECRET_KEY: "<SERVICENOW_SECRET_KEY>"
  # SITEMINDER_SECRET_KEY: "<SITEMINDER_SECRET_KEY>"
  # SURVEYMONKEY_SECRET_KEY: "<SURVEYMONKEY_SECRET_KEY>"
  # TWITTER_SECRET_KEY: "<TWITTER_SECRET_KEY>"

  # --- LinOTP admin credentials  [DISABLED] ---
  # LINOTP_ADMIN_USER: "<LINOTP_ADMIN_USER>"
  # LINOTP_ADMIN_PASSWORD: "<LINOTP_ADMIN_PASSWORD>"

  # --- LDAP bind credentials  [DISABLED] ---
  # LDAP_MASTER_PRINCIPAL: "<LDAP_BIND_DN>"
