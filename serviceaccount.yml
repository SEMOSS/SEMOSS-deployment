# Optional: keyless access to object storage via the cloud's pod-identity
# mechanism (AWS IRSA / GCP Workload Identity / Azure Workload Identity), as an
# alternative to the static S3_ACCESS_KEY / S3_SECRET_KEY in semoss-secrets.
#
# To use it:
#   1. Create a cloud IAM role/identity with access to your storage bucket.
#   2. Replace `annotations: {}` below with the annotation for your cloud
#      (see the examples in the comment) so this ServiceAccount is bound to it.
#   3. Uncomment `serviceAccountName: semoss-pod-s3-service-account` in
#      semoss-deployment.yml (and add this file to kustomization.yaml).
#   4. Remove S3_ACCESS_KEY / S3_SECRET_KEY from semoss-secrets — they're no
#      longer needed; the pod gets temporary, auto-rotating credentials instead.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: semoss-pod-s3-service-account
  namespace: semoss
  # Add the annotation for your cloud (replace the empty map below), e.g.:
  #   AWS EKS (IRSA):
  #     eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/<SEMOSS_S3_ROLE>
  #   GCP GKE (Workload Identity):
  #     iam.gke.io/gcp-service-account: <GSA_NAME>@<PROJECT_ID>.iam.gserviceaccount.com
  #   Azure AKS (Workload Identity):
  #     azure.workload.identity/client-id: <MANAGED_IDENTITY_CLIENT_ID>
  annotations: {}
